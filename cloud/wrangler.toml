name = "sector-defense-api"
main = "src/worker.js"
compatibility_date = "2026-10-09"

# D1 is the single database for this game: accounts, save sync, leaderboards.
# Create it once with `npx wrangler d1 create sector-defense`, then paste the
# printed database_id below (local dev does not need it).
[[d1_databases]]
binding = "DB"
database_name = "sector-defense"
database_id = "f1e1a44b-b2a4-49a4-8967-a5745a7485c1"
migrations_dir = "migrations"
